<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>egui-bevy WebGPU 3D Overlay</title>
    
<script type="module">
import init, * as bindings from './egui-bevy-wasm-3d-overlay-f1599bbbf16a4b17.js';

const wasm = await init({ module_or_path: './egui-bevy-wasm-3d-overlay-2fa179b4f615883c_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171923; color: #f7fafc; font: 14px system-ui, sans-serif; }
      #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
      #status { padding: 10px 14px; background: #252a3a; }
      #status.error { background: #702d35; }
      #canvas-wrap { min-height: 0; flex: 1; }
      #bevy-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    </style>
  <link rel="modulepreload" href="./egui-bevy-wasm-3d-overlay-f1599bbbf16a4b17.js" crossorigin="anonymous" integrity="sha384-hr3fEvScr8uR0BfPkT38vKFVZzx7KFZybLf2SHICEye2vxyStvTZOPNjFWKqLYgY"><link rel="preload" href="./egui-bevy-wasm-3d-overlay-2fa179b4f615883c_bg.wasm" crossorigin="anonymous" integrity="sha384-NSDVK+Npv/1183g6NXiDG5aVNiJTi4zVoIpr4GxLC2UKTONFKtJcmA9g1J43l4dG" as="fetch" type="application/wasm"></head>
  <body>
    <main id="app">
      <div id="status">Starting WebGPU demo…</div>
      <div id="canvas-wrap"><canvas id="bevy-canvas"></canvas></div>
    </main>
    <script>
      const status = document.querySelector("#status");
      if (!navigator.gpu) {
        status.classList.add("error");
        status.textContent = "WebGPU is unavailable in this browser. This demo requires WebGPU and has no WebGL2 fallback.";
      } else {
        status.textContent = "WebGPU available. Starting demo…";
        if (document.querySelector('link[data-trunk][rel="rust"]')) {
          import("./wasm_3d_overlay.js")
            .then(({ default: init }) => init())
            .then(() => {
              status.textContent = "WebGPU demo running. Drag to orbit; use the wheel to zoom.";
            })
            .catch((error) => {
              console.error(error);
              status.classList.add("error");
              status.textContent = `Failed to start the WebGPU demo: ${error}`;
            });
        } else {
          window.addEventListener("TrunkApplicationStarted", () => {
            status.textContent = "WebGPU demo running. Drag to orbit; use the wheel to zoom.";
          }, { once: true });
        }
      }
    </script>
  </body>
</html>
